name: CI

# Roda a cada push e em cada pull request para a main: nada entra na main sem
# a bateria de testes passando.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior, que já está obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # O runner do GitHub já vem com o Docker ligado, que é o que os testes de
      # integração usam para subir um PostgreSQL de verdade via Testcontainers.
      - name: Compilar e testar
        run: ./mvnw -B --no-transfer-progress verify

      - name: Guardar os relatórios dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-surefire
          path: target/surefire-reports/
          retention-days: 7
