logging:
  level:
    org.hibernate.SQL: debug
#    org.springframework.security: debug
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      # No desenvolvimento o PostgreSQL do compose.yaml sobe junto com a aplicação.
      enabled: true

app:
  auth:
    refresh-cookie:
      # Em http o navegador recusaria um cookie Secure. O SameSite continua Strict, como em
      # produção: o proxy do Vite deixa o front e a API na mesma origem também aqui.
      secure: false
