logging:
  level:
    org.hibernate.SQL: debug
#    org.springframework.security: debug
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      # No desenvolvimento o PostgreSQL do compose.yaml sobe junto com a aplicação.
      enabled: true

app:
  auth:
    refresh-cookie:
      # No localhost o front (5173) e a API (8080) são o mesmo site, então Lax basta — e em
      # http o navegador recusaria um cookie Secure.
      secure: false
      same-site: Lax
