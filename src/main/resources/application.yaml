server:
  # Em produção o serviço de hospedagem escolhe a porta e a informa em PORT.
  port: ${PORT:8080}
  servlet:
    # Tudo sob /api. Em produção o Worker do front repassa /api/* para cá sem reescrever o
    # caminho, e no desenvolvimento o proxy do Vite faz o mesmo: o caminho que o navegador vê é
    # o caminho que a API conhece, inclusive o Path do cookie de refresh.
    context-path: /api

spring:
  application:
    name: life-and-money-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  docker:
    compose:
      # Fora do desenvolvimento não existe compose.yaml ao lado do jar; dizer isso
      # explicitamente evita que a aplicação tente procurar um.
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  # Curto de propósito: o access token é o que trafega em toda requisição, e o front o renova
  # sozinho pelo refresh token antes de ele vencer.
  expiration: 15m
  refresh-expiration: 30d

app:
  auth:
    refresh-cookie:
      # O front e a API ficam na mesma origem (o Worker do front faz proxy de /api/*), então
      # o cookie pode ser Strict: o navegador não o envia em nenhuma requisição que parta de
      # outro site, e isso fecha o CSRF na renovação. O padrão é o de produção, com Secure;
      # o perfil dev só tira o Secure, porque o localhost roda em http.
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
