name: life-and-money-api

services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=lifeandmoney'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=lifeandmoney'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeandmoney -d lifeandmoney']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeandmoney
      SPRING_DATASOURCE_USERNAME: lifeandmoney
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET}
      APP_EMAIL_PROVIDER: log
      APP_FRONT_URL: http://localhost:5173
    ports:
      - '8080:8080'